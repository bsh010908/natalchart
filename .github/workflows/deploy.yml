name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/natalchart

            git pull origin main

            /home/ec2-user/natalchart/venv/bin/pip install -r requirements.txt

            sudo systemctl restart natalchart

            sudo systemctl is-active --quiet natalchart
